name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（lint + 单元 + E2E 三引擎）
    runs-on: ubuntu-latest
    # 兜底：步骤挂死时快速失败（GitHub 默认 job 超时 6h）——如 b9f2ef7 修复的 E2E 挂起事故
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier 格式检查
        run: pnpm format:check
      - name: 类型检查 + 构建
        run: pnpm build
      - name: 单元测试
        run: pnpm test:unit
      - name: 质量棘轮（复杂度基线只准收缩；基线 = .devcontainer/scripts/quality-ratchet-baseline.json）
        run: python3 .devcontainer/scripts/quality_ratchet_check.py --service pokemon-choose-you
      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E（chromium / firefox / webkit 兼容性矩阵）
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust（fmt + clippy + 单元/契约/wiremock 集成测试）
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 冷缓存全量编译的余量（热缓存实测 ~1.7m）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 质量棘轮（复杂度基线只准收缩；阈值 = src-tauri/clippy.toml）
        run: python3 .devcontainer/scripts/quality_ratchet_check.py --service src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: Rust 依赖漏洞扫描（cargo audit）
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测 ~13s，余量给 advisory DB 拉取的网络抖动
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-audit
      - name: cargo audit（RustSEC 已知漏洞）
        run: cargo audit --file src-tauri/Cargo.lock
