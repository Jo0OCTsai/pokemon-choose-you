name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（lint + 单元 + E2E 三引擎）
    runs-on: ubuntu-latest
    # 兜底：步骤挂死时快速失败（GitHub 默认 job 超时 6h）——如 b9f2ef7 修复的 E2E 挂起事故
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # workspace 新增 helper 子包携带 electron devDep；前端 job 不跑窗体，跳过二进制下载
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: ESLint
        run: pnpm lint
      - name: Prettier 格式检查
        run: pnpm format:check
      - name: 类型检查 + 构建
        run: pnpm build
      - name: 单元测试（v8 覆盖率 + 阈值门禁，阈值 = vite.config.ts coverage.thresholds）
        run: pnpm test:coverage
      - name: 覆盖率摘要写 job summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const dims = ["lines", "branches", "functions", "statements"];
            const fs = require("node:fs");
            const md = [
              "## 前端覆盖率（vitest v8；api.ts invoke 封装与 i18n 字典不入口径，阈值 65）",
              "",
              `| ${dims.join(" | ")} |`,
              `| ${dims.map(() => "---").join(" | ")} |`,
              `| ${dims.map((k) => `${t[k].pct}%`).join(" | ")} |`,
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '
      - name: 上传覆盖率到 Codecov（frontend flag；公开仓库 tokenless）
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          flags: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 7
      - name: 质量棘轮（复杂度基线只准收缩；基线 = .devcontainer/scripts/quality-ratchet-baseline.json）
        run: python3 .devcontainer/scripts/quality_ratchet_check.py --service pokemon-choose-you
      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E（chromium / firefox / webkit 兼容性矩阵）
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust（fmt + clippy + 单元/契约/wiremock 集成测试 + 覆盖率门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 冷缓存双轮编译余量（clippy 主 target + llvm-cov 插桩独立 target；热缓存实测 ~2m）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-llvm-cov
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 质量棘轮（复杂度基线只准收缩；阈值 = src-tauri/clippy.toml）
        run: python3 .devcontainer/scripts/quality_ratchet_check.py --service src-tauri
      - name: cargo llvm-cov（全量测试 + 覆盖率门禁，声明与 stack.json test_cmd 一致：GUI 胶水不入口径）
        run: |
          cd src-tauri
          CARGO_TARGET_DIR=target/llvm-cov cargo llvm-cov --fail-under-lines 85 --ignore-filename-regex '(input|tray|shortcuts|lib|main)\.rs$' --lcov --output-path target/llvm-cov/lcov.info
          CARGO_TARGET_DIR=target/llvm-cov cargo llvm-cov report --html --output-dir target/llvm-cov/report
      - name: 覆盖率摘要写 job summary（复用 profdata，秒级）
        run: |
          {
            echo "## Rust 覆盖率（cargo-llvm-cov；input/tray/shortcuts/lib/main GUI 胶水不入口径，lines 阈值 85）"
            echo ""
            echo '```'
            cd src-tauri && CARGO_TARGET_DIR=target/llvm-cov cargo llvm-cov report --summary-only --ignore-filename-regex '(input|tray|shortcuts|lib|main)\.rs$' 2>/dev/null | grep -E "^(Filename|TOTAL)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传覆盖率到 Codecov（rust flag；公开仓库 tokenless）
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: src-tauri/target/llvm-cov/lcov.info
          flags: rust
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-rust
          path: |
            src-tauri/target/llvm-cov/lcov.info
            src-tauri/target/llvm-cov/report/
          retention-days: 7

  plugin:
    name: dsh 插件（lint + 类型 + 单测 + 覆盖率门禁 + helper）
    runs-on: ubuntu-latest
    timeout-minutes: 12 # 骨架期秒级；余量给依赖安装、helper 真 stdio 子进程契约测试与后续契约回放套件
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
        env:
          # helper 的 electron devDep 只在开发机本地跑窗体；CI headless 测试不需要二进制
          # （ELECTRON_SKIP_BINARY_DOWNLOAD 由 electron 官方 install 脚本识别）
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: ESLint
        run: pnpm --filter pokemon-choose-you-dsh lint
      - name: Prettier 格式检查
        run: pnpm --filter pokemon-choose-you-dsh format:check
      - name: 类型检查
        run: pnpm --filter pokemon-choose-you-dsh typecheck
      - name: 单元测试 + 契约回放（v8 覆盖率 + 阈值门禁，business core 口径 = src/host/**（NFR-5），阈值 = dsh-plugin/vite.config.ts thresholds 85）
        # vitest 同进程消费 contracts/fixtures（与 rust job 同 commit 的 checked-in 版本）：
        # contracts-replay.spec（43 场景逐字段回放 + M3a 完备性）与 compat.spec（兼容矩阵 ×
        # CAPABILITY_KEYS 一致性）即本步的一部分——无独立回放步骤，勿重复挂载（AD §4.4/§7.3）
        run: pnpm --filter pokemon-choose-you-dsh test:coverage
      - name: 质量棘轮（复杂度基线只准收缩；基线 = .devcontainer/scripts/quality-ratchet-baseline.json）
        run: python3 .devcontainer/scripts/quality_ratchet_check.py --service pokemon-choose-you-dsh
      # ---- 桌宠 Electron helper 子包（并行组 2；窗体不进 CI——headless 跳过 BrowserWindow）----
      - name: helper 类型检查（pokemon-choose-you-helper）
        run: pnpm --filter pokemon-choose-you-helper typecheck
      - name: helper 单元测试（bridge 契约真 stdio fake host + 状态机纯逻辑 + headless 运行时集成）
        run: pnpm --filter pokemon-choose-you-helper test
      - name: 分发物断言（D30/debt ⑥：helper 产物随包 + uiohook prebuild 在场——NFR-12①）
        # 构建后以 file: 形态装进 scratch 目录（模拟 profile 安装），断言三件：
        # ①插件包内 helper/dist/main.js 在场（files 分发面）②dist/host.js 在场
        # ③uiohook-napi 经插件闭包解析可达且平台 prebuild 在场（spike ③ 同口径——解析锚定
        #   优于裸路径：pnpm isolated 布局依赖在 virtual store，裸路径断言会假红）
        run: |
          pnpm --filter pokemon-choose-you-dsh build
          tmp=$(mktemp -d)
          cd "$tmp"
          echo '{"name":"pky-dist-check","private":true}' > package.json
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - .
          allowBuilds:
            "@deepseek-ai/dsh-subprocess-local": false
            koffi: false
            node-pty: false
            uiohook-napi: false
          YAML
          pnpm add "file:$GITHUB_WORKSPACE/dsh-plugin"
          test -f node_modules/pokemon-choose-you-dsh/dist/host.js
          test -f node_modules/pokemon-choose-you-dsh/helper/dist/main.js
          # 插件显示元数据分发面（dsh 插件管理器 readPluginMeta 消费：locale/* 三语 title/description + icon）
          test -f node_modules/pokemon-choose-you-dsh/locale/en.json
          test -f node_modules/pokemon-choose-you-dsh/icon.svg
          node -e "const {createRequire}=require('node:module'); const fs=require('node:fs'); const path=require('node:path'); const real=fs.realpathSync('node_modules/pokemon-choose-you-dsh/dist/host.js'); const r=createRequire(real); const u=path.join(path.dirname(r.resolve('uiohook-napi')), '..', 'prebuilds', 'linux-x64', 'uiohook-napi.node'); fs.accessSync(u); console.log('uiohook prebuild OK:', u); console.log('dsh-ssh closure OK:', r.resolve('@deepseek-ai/dsh-ssh/package.json'))"
      # schema 字节同源断言在 rust job 的 contracts_schema_single_source（include_str! × 磁盘）；
      # i18n 三语键集断言随 i18n 装配模块（并行组后续任务）挂入本 job

  supply-chain:
    name: 供应链扫描（pnpm audit + cargo-deny + gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 实测各步秒级~1m，余量给 advisory DB 拉取的网络抖动
    steps:
      # gitleaks 全历史扫描需要完整提交历史（默认浅克隆 1 条会漏）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: pnpm audit（npm 依赖漏洞，high 及以上）
        # GHSA-vfj7-8cjw-p6xm（braces 栈耗尽 DoS）豁免：官方无修复版（最新 3.0.3 即
        # 受影响），落点纯 dev 链（eslint 转译），触发需恶意嵌套 glob——本项目只扫
        # 自家静态路径。--ignore 旗标是关键：pnpm-workspace.yaml 的 auditConfig 只影响
        # 展示归类、不改退出码（实测 11.27），删旗标 CI 即红；上游出补丁后旗标与
        # 配置段一并移除（docs/debt.md）
        run: pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-deny
      - name: 安装 gitleaks（8.30.1；install-action 不收录 Go 程序）
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: cargo deny（Rust 依赖 license / 漏洞 / ban；配置 = src-tauri/deny.toml）
        run: cargo deny --log-level error check
        working-directory: src-tauri
      - name: gitleaks（全历史秘密扫描；豁免 = .gitleaks.toml）
        run: gitleaks detect --source . --redact
