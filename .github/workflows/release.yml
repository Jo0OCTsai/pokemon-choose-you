name: Release

# 开发版 draft 流：push main（或手动触发）始终构建「当前开发版本」的草稿 Release——
# 正式发布 = 在 GitHub 上 publish 草稿（publish 时自动创建 v* 标签）；
# 之后 npm run bump <下一版本> 抬高版本文件，后续构建自然变成下一版的草稿。
# 版本号唯一来源是 tauri.conf.json 的 version（package.json / Cargo.toml 同步由 npm run bump 维护）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # 默认只读；需要写 Release 的 job（prepare 删旧草稿、build 经 tauri-action 建草稿
  # 并上传产物）单独提权——缩小持有发布产物写权限的面
  contents: read

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            # tag 存在 = 该版本已正式发布过：跳过构建，提示先抬版本
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION 已正式发布（tag 在位）。运行 npm run bump <下一个版本> 后再构建。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # 同版本的旧草稿删掉重打，产物不叠加、changelog 不残留
            gh release delete "v$VERSION" --yes >/dev/null 2>&1 || true
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macOS (Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
          - platform: windows-latest # Windows (NSIS 安装包)
            args: ""
          - platform: ubuntu-22.04 # Linux (deb / rpm / AppImage)，22.04 的 glibc 较老、产物兼容性好
            # productName「POKéMON Choose You」含空格与非 ASCII，deb/rpm 包名不合法：Linux 打包覆盖回 ASCII 产品名
            args: "--config src-tauri/tauri.linux.conf.json"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: 安装 Tauri 系统依赖 (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm install
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名（bundle.createUpdaterArtifacts 开启后 tauri-action 会自动产出并上传 latest.json）
          # 私钥生成：npx tauri signer generate -w ~/.tauri/pokemon-choose-you.key ；须配置为仓库 secret
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名（自签证书）：给所有 release 一个稳定签名身份，辅助功能等
          # TCC 授权跨版本存活（非 Apple 公证，Gatekeeper 首开仍需「仍要打开」）。
          # 证书与密码存 ~/Library/Application Support/pokemon-choose-you/release-signing/，
          # 生成与轮换步骤见 docs/DEVELOPMENT.md「macOS 开发签名」。仅 macOS 矩阵生效，
          # 其余平台留空被忽略。
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          # 版本占位符取自 tauri.conf.json 的 version：draft 始终跟随当前开发版本
          tagName: v__VERSION__
          releaseName: "就决定是你了 v__VERSION__"
          releaseBody: |
            🐾 一只宝可梦桌宠，陪你捕捉每一天的待办。本地优先，轻量常驻。

            ## 功能亮点

            - **桌宠常驻**：透明置顶窗口，按任务分类轮换精灵（6 只可换装），拖动 / 双击打开图鉴机、快捷图鉴屏随时出发
            - **专注模式 + 番茄钟**：全局唯一"进行中"任务，⏸/▶/✔/⇄ 一键操作，番茄时长与短休息可配置
            - **图鉴机主面板**：今日冒险 / 草丛 / 路线 / 图鉴 / 收音机五段旅程，分级提醒（紧急任务桌宠敲门）
            - **集成**：任意 OpenAI 兼容 AI、飞书消息→AI 识别待办、Todoist 双向同步
            - **常驻标配**：系统托盘、全局快捷键（Ctrl/Cmd+Shift+K 快速捕捉 · Ctrl/Cmd+Shift+D 显隐桌宠）、单实例、窗口位置记忆、应用内自动更新（minisign 签名）
            - **三语界面**：简体中文 / 繁體中文 / English

            ## 平台与数据

            | 平台 | 包 | 备注 |
            |---|---|---|
            | macOS (Intel + Apple Silicon) | `.dmg` | 带固定自签证书（稳定身份，辅助功能授权跨版本存活）；非 Apple 公证，首次打开需 Gatekeeper「仍要打开」 |
            | Windows | `.exe` (NSIS) | SmartScreen「更多信息 → 仍要运行」 |
            | Linux | `.AppImage` / `.deb` / `.rpm` | 实验性：置顶需 X11；NVIDIA 白屏设 `WEBKIT_DISABLE_DMABUF_RENDERER=1`；仅 AppImage 支持自动更新 |

            macOS 包为自签证书（非 Apple 官方签名/公证，详见仓库 SECURITY.md）；Windows 包未做 OS 代码签名。更新包均经 minisign 签名校验。
            数据（SQLite）存于本机：Linux `~/.local/share/com.jotsai.pokemonchooseyou/` · macOS `~/Library/Application Support/com.jotsai.pokemonchooseyou/` · Windows `%APPDATA%\com.jotsai.pokemonchooseyou\`。
            0.x 阶段数据格式未承诺稳定，升级前请备份数据库文件。
          releaseDraft: true
          args: ${{ matrix.args }}
