# Codecov 配置（CI 上传 frontend/rust 两 flag 的覆盖率报告）
# 硬门禁在 CI（vite thresholds 65 / llvm-cov --fail-under-lines 85）+ 质量棘轮地板；
# Codecov 侧 status 设 informational：提供 PR 覆盖率 comment 与趋势，不重复挡 PR
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  frontend:
    paths:
      - src/
      - "!src-tauri/**"
    carryforward: false
  rust:
    paths:
      - src-tauri/src/
    carryforward: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
