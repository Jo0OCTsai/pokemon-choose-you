[package]
name = "pokemon-knock"
version = "1.1.0"
description = "宝可梦来敲门 — 桌宠待办系统"
authors = ["joeca"]
edition = "2021"
# 多 bin（src/main.rs + src/bin/pk.rs）时 tauri-cli 依据 default-run 认主程序；
# 缺失时打包器会退选 src/bin 下的第一个 bin（pk CLI），产物装出来是 CLI 而非应用
default-run = "pokemon-knock"

[lib]
name = "pokemon_knock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2.5.1"
# 常驻应用标配：单实例 / 窗口状态记忆 / 全局快捷键 / 自动更新
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "macros", "process", "io-util"] }
reqwest = { version = "0.12", features = ["json"] }
# pk CLI 定位应用数据库文件（与 tauri 的 app_data_dir 同一规则：config_dir/<identifier>）
dirs = "5"
log = "0.4"
thiserror = "2"
# 秘钥存 OS 钥匙串（macOS Keychain / Windows Credential Manager / Linux Secret Service）；
# 默认特性 v1 的 linux 后端为纯 Rust zbus，无需 libdbus 系统依赖
keyring = "4"

[dev-dependencies]
# 仅测试构建启用 mock 运行时，不影响正常编译与发布产物
tauri = { version = "2", features = ["test"] }
# HTTP 集成测试：ai / feishu / todoist 的 reqwest 分支用 mock 服务器覆盖
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
