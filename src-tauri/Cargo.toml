[package]
name = "pokemon-choose-you"
version = "1.0.0"
description = "就决定是你了 — 桌宠待办系统"
authors = ["JoTsai"]
edition = "2021"
# 多 bin（src/main.rs + src/bin/pk.rs）时 tauri-cli 依据 default-run 认主程序；
# 缺失时打包器会退选 src/bin 下的第一个 bin（pk CLI），产物装出来是 CLI 而非应用
default-run = "pokemon-choose-you"

[lib]
name = "pokemon_choose_you_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-notification = "2.4.0"
tauri-plugin-log = "2.9.2"
tauri-plugin-autostart = "2.5.1"
# 常驻应用标配：单实例 / 窗口状态记忆 / 全局快捷键 / 自动更新
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
# 桌面交互：右键菜单的剪贴板读写（WebView 里 navigator.clipboard 读常被权限卡住）+ 导出另存为对话框
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["time", "macros", "process", "io-util"] }
# pk CLI 定位应用数据库文件（与 tauri 的 app_data_dir 同一规则：config_dir/<identifier>）
dirs = "7.0.0"
log = "0.4.34"
thiserror = "2.0.20"
# 秘钥存 OS 钥匙串（macOS Keychain / Windows Credential Manager / Linux Secret Service）；
# 默认特性 v1 的 linux 后端为纯 Rust zbus，无需 libdbus 系统依赖
keyring = "4.2.0"
# 派发会话续接：预生成 claude --session-id 用的 UUID v4
uuid = { version = "1.26.1", features = ["v4"] }

# 输入响应（F1）：全局键鼠活动强度监听（回调只递增计数器，不取内容），仅 Windows/Linux；
# macOS 自写最小 CGEventTap（见 input.rs）——rdev 0.5.3 在监听线程调 TIS 布局 API，
# 部分 macOS×键盘布局组合下授权后一敲键就段错误闪退（Narsil/rdev#146，修复未发布）
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5.3"

[dev-dependencies]
# 仅测试构建启用 mock 运行时，不影响正常编译与发布产物
tauri = { version = "2.11.6", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
