# cargo-deny 配置（CI supply-chain job 消费；本地 `cargo deny check` 同口径）
# license 白名单 = 依赖树实际 SPDX 清单（cargo deny list 建账 2026-09-28）：
# 全部为宽松或文件级弱 copyleft，无 GPL/AGPL 强传染项。
# r-efi 的 LGPL-2.1 仅 UEFI target 编译路径（getrandom 可选依赖），桌面/移动构建不链接，义务不触发。

[advisories]
version = 2
yanked = "deny"
# workspace = 仅直接依赖失维护才报错（proc-macro-error / unic-* 系全是 tao/wry/servo
# 的传递依赖，上游迁移前无解；传递依赖的 unmaintained 仅提示不阻断）
unmaintained = "workspace"
# zip 4.6.1（tauri-plugin-updater 2.12 传递依赖）extract 符号链接四连 advisory——仅修于
# zip 9.x，而 updater 全部已发布版本（含 2.14.0/3.0.0-alpha）semver 锁 zip ^4；2.14.1
# （首个 zip ^9 版本）发布后升级并移除本豁免（tauri-apps/plugins-workspace#3712）。
# 降险事实：zip 在 updater 中是 cfg(target_os = "windows") target 依赖，本仓 macOS 载体
# 产物不编译 zip，cargo deny 跨 target 扫全依赖图才报。
ignore = [
  { id = "RUSTSEC-2026-0369", reason = "zip 4.x 无补丁版；等 tauri-plugin-updater 2.14.1（zip ^9）；macOS 产物不编译 zip（windows target 依赖）" },
  { id = "RUSTSEC-2026-0368", reason = "同上：zip extract 符号链接簇，仅修于 9.0.0" },
  { id = "RUSTSEC-2026-0367", reason = "同上：zip SUID/SGID 保留，仅修于 9.0.0" },
  { id = "GHSA-m665-v7pm-7grj", reason = "同上：zip 9.0.4 以下「Zip Cloaking」双头解析差异，仅修于 9.0.5" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# UEFI 专用 crate（getrandom 可选依赖），LGPL 仅 UEFI target 编译路径，
# 桌面/移动构建不链接，传染义务不触发
[[licenses.exceptions]]
crate = "r-efi"
allow = ["LGPL-2.1-or-later"]

[bans]
# 多版本重复只警告（Tauri 生态 windows-sys 等多版本普遍，deny 会常年红）
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
