<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>收音机 · 分诊原型 — 就决定是你了</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      /* ===== 设计令牌（与 src/dex.css 一致） ===== */
      :root {
        --dex-red: #ee1515;
        --dex-red-dark: #b01010;
        --dex-body: #f5f0dc;
        --dex-navy: #1a1b25;
        --poke-yellow: #ffcb05;
        --lcd: #c4cfa1;
        --lcd-text: #3a4a32;
        --lcd-dark: #9caa86;
        --type-work: #f8d030;
        --p-urgent: #ee1515;
        --p-high: #f08030;
        --p-normal: #78c850;
        --p-low: #a8a878;
        --ok: #1d6b3c;
        --warn: #a1660a;
        --muted: #6b6657;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--dex-navy);
        background: var(--dex-body);
        overflow: hidden;
      }
      .px {
        font-family: "Press Start 2P", monospace;
      }
      button {
        font-family: inherit;
      }

      /* ===== 整体框架：机脊 + 内容区 ===== */
      .dex {
        display: flex;
        height: 100vh;
        background: var(--dex-body);
        overflow: hidden;
      }
      .dex-spine {
        width: 200px;
        flex: none;
        background: linear-gradient(180deg, var(--dex-red) 0%, var(--dex-red) 78%, var(--dex-red-dark) 100%);
        border-right: 4px solid var(--dex-navy);
        padding: 18px 14px;
        color: #fff;
        display: flex;
        flex-direction: column;
      }
      .dex-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .dex-big-led {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff9d9d, #d01111 60%, #8f0b0b);
        border: 3px solid var(--dex-navy);
        animation: pk-breathe 2.5s infinite;
      }
      .dex-sub-leds {
        display: flex;
        gap: 5px;
      }
      .dex-sub-leds i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--poke-yellow);
        border: 2px solid var(--dex-navy);
      }
      .dex-sub-leds i:last-child {
        background: #5be36b;
      }
      .dex-title {
        font-size: 9px;
        line-height: 1.8;
        margin: 10px 0 16px;
        color: #ffe9e9;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35);
      }
      .menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .menu-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.18);
        border: 3px solid transparent;
        border-radius: 8px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 11px 12px;
        cursor: pointer;
        min-height: 44px;
        text-align: left;
      }
      .menu-btn .cursor {
        width: 12px;
        flex: none;
        opacity: 0;
        font-size: 12px;
      }
      .menu-btn.active {
        background: var(--poke-yellow);
        color: var(--dex-navy);
        border-color: var(--dex-navy);
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
      }
      .menu-btn.active .cursor {
        opacity: 1;
      }
      .menu-btn .count {
        margin-left: auto;
        font-size: 10px;
        background: var(--dex-navy);
        color: #fff;
        border-radius: 4px;
        padding: 2px 5px;
      }
      .tip {
        margin-top: auto;
        font-size: 11px;
        line-height: 1.7;
        color: #ffd9d9;
        background: rgba(0, 0, 0, 0.15);
        border-radius: 8px;
        padding: 8px;
      }

      .dex-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .dex-main-head {
        padding: 16px 20px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dex-main-head h1 {
        font-size: 16px;
        letter-spacing: 1px;
        margin: 0;
      }
      .dex-main-head .sub {
        font-size: 10px;
        color: #7b7460;
        margin-top: 5px;
      }
      .kbd-help {
        margin-left: auto;
      }

      /* ===== 收音机两栏 ===== */
      .radio {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 14px;
        padding: 4px 20px 20px;
      }

      /* ---- 左栏：电波列表 ---- */
      .radio-left {
        width: 320px;
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }
      .radio-toolbar {
        display: flex;
        gap: 8px;
      }
      .search-input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        font-size: 13px;
        background: #fff;
        font-family: inherit;
        box-shadow: 3px 3px 0 var(--dex-navy);
        min-height: 36px;
      }
      .view-toggle {
        display: flex;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 3px 3px 0 var(--dex-navy);
        background: #fff;
        flex: none;
      }
      .view-toggle button {
        border: 0;
        background: transparent;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        color: var(--dex-navy);
      }
      .view-toggle button.on {
        background: var(--poke-yellow);
      }

      .radio-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        background: #fff;
        box-shadow: 3px 3px 0 var(--dex-navy);
        padding: 6px;
      }
      .list-group + .list-group {
        margin-top: 6px;
      }
      .lg-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 800;
        padding: 6px 6px;
        cursor: pointer;
        user-select: none;
        border-radius: 6px;
      }
      .lg-head:hover {
        background: var(--dex-body);
      }
      .lg-head .lg-caret {
        font-size: 10px;
        width: 12px;
      }
      .lg-head .lg-count {
        font-size: 10px;
        background: var(--dex-navy);
        color: #fff;
        border-radius: 4px;
        padding: 1px 5px;
      }
      .lg-head .lg-count.hot {
        background: var(--dex-red);
      }
      .lg-head .lg-state {
        margin-left: auto;
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
      }
      /* 无信号组头的一键清空 */
      .clear-noise {
        font-size: 11px;
        font-weight: 700;
        border: 2px solid var(--dex-navy);
        border-radius: 6px;
        background: #fff;
        padding: 2px 8px;
        cursor: pointer;
      }
      .clear-noise:hover {
        background: var(--dex-body);
      }
      .clear-noise:active {
        transform: translate(1px, 1px);
      }
      .list-group.collapsed .lg-body {
        display: none;
      }

      .rrow {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 7px 8px;
        border-radius: 8px;
        cursor: pointer;
        border: 3px solid transparent;
      }
      .rrow:hover {
        background: var(--dex-body);
      }
      .rrow.sel {
        background: #fff6c4;
        border-color: var(--dex-navy);
        box-shadow: 2px 2px 0 var(--dex-navy);
      }
      .rrow.dim {
        opacity: 0.55;
      }
      .rrow .im-check {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        accent-color: var(--dex-navy);
        cursor: pointer;
        flex: none;
      }
      .r-main {
        flex: 1;
        min-width: 0;
      }
      .r-line1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
      }
      .chat-badge {
        flex: none;
        font-size: 9px;
        font-weight: 800;
        color: var(--muted);
        border: 1.5px solid #b9b29c;
        border-radius: 4px;
        padding: 0 4px;
      }
      .r-sender {
        flex: none;
        max-width: 96px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .r-time {
        margin-left: auto;
        flex: none;
        font-size: 10px;
        color: var(--muted);
        font-weight: 500;
      }
      .r-snippet {
        margin-top: 3px;
        font-size: 12px;
        color: #43413a;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .r-mark {
        flex: none;
        margin-top: 2px;
        font-size: 10px;
        font-weight: 800;
      }
      .r-mark.ok {
        color: var(--dex-navy);
      }
      .r-mark.no {
        color: var(--muted);
      }
      /* 置信色点 */
      .conf {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 2px solid var(--dex-navy);
        flex: none;
      }
      .conf.high {
        background: #5be36b;
      }
      .conf.medium {
        background: var(--poke-yellow);
      }
      .conf.low {
        background: #d8d2bd;
      }
      .pending-empty {
        padding: 18px 10px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        line-height: 2;
      }

      /* ---- 批量条（左栏底部） ---- */
      .batch-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        background: #fff;
        box-shadow: 3px 3px 0 var(--dex-navy);
        padding: 6px 8px;
      }
      .btn {
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        background: var(--poke-yellow);
        color: var(--dex-navy);
        font-size: 13px;
        font-weight: 700;
        padding: 6px 10px;
        cursor: pointer;
        box-shadow: 3px 3px 0 var(--dex-navy);
        transition:
          transform 0.08s,
          box-shadow 0.08s;
        min-height: 34px;
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--dex-navy);
      }
      .btn.ghost {
        background: #fff;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
      .batch-bar .btn {
        padding: 4px 8px;
        font-size: 12px;
        min-height: 30px;
      }
      .batch-check {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
      }
      .hi-conf-btn {
        font-size: 11px;
        font-weight: 700;
        border: 0;
        background: transparent;
        color: var(--warn);
        cursor: pointer;
        padding: 4px 2px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* ---- 右栏：详情 ---- */
      .radio-right {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      .d-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 2;
        text-align: center;
      }
      .d-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .d-meta .type-badge {
        color: var(--dex-navy);
        border: 2px solid var(--dex-navy);
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 10px;
        background: #fff;
      }
      .ai-status {
        margin-left: auto;
        font-size: 10px;
        font-weight: 800;
        border: 2px solid var(--dex-navy);
        border-radius: 4px;
        padding: 1px 6px;
        background: #fff;
      }
      .lcd {
        background: var(--lcd);
        border: 3px solid var(--dex-navy);
        border-radius: 4px;
        box-shadow:
          inset 3px 3px 0 var(--lcd-dark),
          4px 4px 0 var(--dex-navy);
        color: var(--lcd-text);
        position: relative;
        overflow: hidden;
      }
      .lcd::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.05) 0 2px, transparent 2px 4px);
      }
      .d-content {
        padding: 14px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.8;
        white-space: pre-wrap;
        flex: 1;
        min-height: 120px;
        overflow-y: auto;
      }
      .d-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* AI 建议块 */
      .d-suggest {
        font-size: 13px;
        font-weight: 700;
        color: var(--dex-navy);
        background: #fff;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        padding: 8px 12px;
        box-shadow: 3px 3px 0 var(--dex-navy);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .d-suggest.update {
        background: #fff8e6;
      }
      .d-suggest.none {
        background: #f1eede;
        color: var(--muted);
        font-weight: 600;
      }
      .sug-prio {
        font-size: 11px;
        border: 2px solid var(--dex-navy);
        border-radius: 4px;
        padding: 0 6px;
      }
      .sug-prio.urgent {
        color: #fff;
        background: var(--p-urgent);
      }
      .sug-prio.high {
        color: #a14b0a;
        background: var(--p-high);
      }
      .sug-prio.normal {
        color: var(--ok);
        background: var(--p-normal);
      }
      .sug-tag {
        font-size: 11px;
        color: #fff;
        background: #8a97b8;
        border: 2px solid var(--dex-navy);
        border-radius: 999px;
        padding: 0 7px;
      }
      .sug-conf {
        font-size: 11px;
        font-weight: 800;
        border: 2px solid var(--dex-navy);
        border-radius: 4px;
        padding: 0 6px;
      }
      .sug-conf.c-high {
        color: var(--ok);
        background: #dff3e4;
      }
      .sug-conf.c-medium {
        color: var(--warn);
        background: #fff3d6;
      }
      .sug-conf.c-low {
        color: var(--muted);
        background: #eceada;
      }
      .sug-reason {
        flex-basis: 100%;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .done-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 800;
        color: var(--dex-navy);
        background: #dff3e4;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        box-shadow: 3px 3px 0 var(--dex-navy);
        padding: 10px 12px;
      }

      /* 操作区（固定高度，不随消息变化） */
      .d-actions {
        flex: none;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .kbd {
        display: inline-block;
        font-family: "Press Start 2P", monospace;
        font-size: 8px;
        background: #fff;
        border: 2px solid var(--dex-navy);
        border-bottom-width: 3px;
        border-radius: 4px;
        padding: 2px 5px;
        margin-left: 6px;
        vertical-align: 1px;
      }
      .btn.red .kbd {
        background: rgba(255, 255, 255, 0.25);
      }
      .er-toggle {
        padding: 6px 8px;
      }

      /* 逃走原因弹层 */
      .escape-pop {
        position: fixed;
        z-index: 60;
        background: #fff;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--dex-navy);
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 180px;
      }
      .escape-pop .er-label {
        font-size: 10px;
        font-weight: 800;
        color: var(--muted);
        padding: 2px 6px 6px;
      }
      .escape-pop button {
        border: 2px solid var(--dex-navy);
        background: #fff;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 10px;
        cursor: pointer;
        text-align: left;
      }
      .escape-pop button:hover {
        background: var(--dex-body);
      }
      .escape-pop button.just {
        border-style: dashed;
        color: var(--muted);
      }

      /* 撤销 toast */
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 70;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 3px solid var(--dex-navy);
        border-radius: 8px;
        box-shadow: 4px 4px 0 var(--dex-navy);
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        animation: toast-in 0.18s ease-out;
      }
      .toast button {
        border: 2px solid var(--dex-navy);
        border-radius: 6px;
        background: var(--poke-yellow);
        font-size: 12px;
        font-weight: 800;
        padding: 4px 10px;
        cursor: pointer;
      }
      @keyframes toast-in {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      /* 快捷键帮助 */
      .help-mask {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(26, 27, 37, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .help-card {
        background: var(--dex-body);
        border: 4px solid var(--dex-navy);
        border-radius: 10px;
        box-shadow: 6px 6px 0 var(--dex-navy);
        padding: 20px 24px;
        width: 420px;
      }
      .help-card h2 {
        font-size: 14px;
        margin: 0 0 14px;
      }
      .help-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        padding: 6px 0;
      }
      .help-row .kbd {
        margin-left: 0;
      }
      .help-row .desc {
        color: #43413a;
      }

      /* 滚动条像素化 */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--dex-navy);
        border-radius: 6px;
        border: 3px solid var(--dex-body);
      }

      @keyframes pk-breathe {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="dex">
      <!-- 机脊（示意，仅收音机可点） -->
      <aside class="dex-spine">
        <div class="dex-head">
          <div class="dex-big-led"></div>
          <div class="dex-sub-leds"><i></i><i></i></div>
        </div>
        <div class="dex-title px">POKé-DEX<br />LET'S CATCH!</div>
        <nav class="menu">
          <button class="menu-btn"><span class="cursor">▶</span>冒险</button>
          <button class="menu-btn"><span class="cursor">▶</span>草丛</button>
          <button class="menu-btn"><span class="cursor">▶</span>路线</button>
          <button class="menu-btn"><span class="cursor">▶</span>图鉴</button>
          <button class="menu-btn active">
            <span class="cursor">▶</span>收音机 <span class="count px" id="spineCount">6</span>
          </button>
          <button class="menu-btn"><span class="cursor">▶</span>设置</button>
        </nav>
        <div class="tip">收音机里好像有新电波哦~</div>
      </aside>

      <!-- 内容区 -->
      <main class="dex-main">
        <div class="dex-main-head">
          <div>
            <h1>收音机</h1>
            <div class="sub">收听飞书传来的电波，从中捕捉待办 · 原型演示</div>
          </div>
          <button class="btn ghost kbd-help" id="helpBtn">? 快捷键</button>
        </div>

        <div class="radio">
          <!-- 左栏：电波列表 -->
          <section class="radio-left">
            <div class="radio-toolbar">
              <input class="search-input" id="searchInput" placeholder="🔍 搜索电波（消息 / 会话 / 发送者）" />
              <div class="view-toggle" title="列表分组方式">
                <button id="modeTime" class="on">⏱时间</button>

      ];

      /* ================= 状态 ================= */
      let mode = "time"; // time | channel
      let selectedId = 1;
      const checked = new Set();
      const collapsed = new Set(["caught", "escaped"]); // 分区默认收起
      let toastTimer = null;
      let undoSnapshot = null;

      const byId = (id) => messages.find((m) => m.id === id);
      const pending = () => messages.filter((m) => m.reviewStatus === "pending");
      // 待处理里再分两档：AI 挑出的信号（todo/更新建议）要细审，无信号只需快速清扫
      const pendingSignal = () => pending().filter((m) => m.aiStatus === "todo" || m.aiStatus === "update");
      const pendingNoise = () => pending().filter((m) => m.aiStatus === "none");
      const caughtList = () => messages.filter((m) => m.reviewStatus === "accepted");
      const escapedList = () => messages.filter((m) => m.reviewStatus === "dismissed");
      const confLabel = (c) => ({ high: "高置信", medium: "中置信", low: "低置信" })[c] || "";
      const typeLabel = (t) => ({ group: "群聊", p2p: "私聊", bot: "机器人" })[t] || "";
      const statusLabel = (s) => ({ todo: "待办信号", update: "更新建议", none: "无信号", followup: "跟进" })[s] || s;

      /* ================= 左栏渲染 ================= */
      function rowHtml(m, showChat) {
        const checkedAttr = checked.has(m.id) ? "checked" : "";
        const selCls = m.id === selectedId ? "sel" : "";
        if (m.reviewStatus === "pending") {
          return `<div class="rrow ${selCls}" data-id="${m.id}">
            <input type="checkbox" class="im-check" data-check="${m.id}" ${checkedAttr} title="勾选批量处理" />
            <div class="r-main">
              <div class="r-line1">
                ${showChat ? `<span class="chat-badge">${typeLabel(m.chatType)}·${m.chatName}</span>` : ""}
                <span class="r-sender">${m.sender}</span>
                ${m.aiStatus === "update" ? `<span class="chat-badge">🔧 更新</span>` : ""}
                ${!showChat && m.aiStatus === "none" ? `<span class="chat-badge">🔇 无信号</span>` : ""}
                <span class="conf ${m.conf}" title="${confLabel(m.conf)}"></span>
                <span class="r-time">${m.time}</span>
              </div>
              <div class="r-snippet">${m.content.split("\n")[0]}</div>
            </div>
          </div>`;
        }
        // 已处理行：更紧凑，右侧状态标
        const mark = m.followupTaskId
          ? `<span class="r-mark ok">✔ 并入 No.${m.followupTaskId}</span>`
          : m.reviewStatus === "accepted"
            ? `<span class="r-mark ok">✔ No.${m.taskId}</span>`
            : `<span class="r-mark no">✕ 逃走</span>`;
        return `<div class="rrow dim ${selCls}" data-id="${m.id}">
          <div class="r-main">
            <div class="r-line1">
              ${showChat ? `<span class="chat-badge">${typeLabel(m.chatType)}·${m.chatName}</span>` : ""}
              <span class="r-sender">${m.sender}</span>
              <span class="r-time">${m.time}</span>
            </div>
            <div class="r-snippet">${m.content.split("\n")[0]}</div>
          </div>
          ${mark}
        </div>`;
      }

      function renderList() {
        const el = document.getElementById("list");
        const q = document.getElementById("searchInput").value.trim();
        const filter = (list) =>
          q ? list.filter((m) => (m.content + m.chatName + m.sender).toLowerCase().includes(q.toLowerCase())) : list;

        if (mode === "time") {
          const p = filter(pendingSignal());
          const n = filter(pendingNoise());
          const c = filter(caughtList());
          const e = filter(escapedList());
          const group = (key, title, list, hot) => {
            const isCollapsed = collapsed.has(key);
            return `<div class="list-group ${isCollapsed ? "collapsed" : ""}" data-group="${key}">
              <div class="lg-head" data-toggle="${key}">
                <span class="lg-caret">${isCollapsed ? "▸" : "▾"}</span>${title}
                <span class="lg-count ${hot ? "hot" : ""}">${list.length}</span>
                <span class="lg-state">${isCollapsed ? "展开" : "收起"}</span>
                ${key === "noise" && list.length ? `<button class="clear-noise" data-clear-noise title="全部逃走无信号消息">✕ 一键清空</button>` : ""}
              </div>
              <div class="lg-body">
                ${
                  list.length
                    ? list.map((m) => rowHtml(m, true)).join("")
                    : key === "pending"
                      ? `<div class="pending-empty">待办信号全部处理完！<br />训练家效率惊人 ⚡</div>`
                      : `<div class="pending-empty">（空）</div>`
                }
              </div>
            </div>`;
          };
          el.innerHTML =
            group("pending", "◎ 待办信号", p, true) +
            group("noise", "🔇 无信号", n) +
            group("caught", "✔ 已捕捉", c) +
            group("escaped", "✕ 已逃走", e);
        } else {
          // 频道模式：按会话分组
          const chats = new Map();
          for (const m of messages) {
            if (!chats.has(m.chatName)) chats.set(m.chatName, []);
            chats.get(m.chatName).push(m);
          }
          el.innerHTML = [...chats.entries()]
            .map(([name, list]) => {
              const p = list.filter((m) => m.reviewStatus === "pending" && m.aiStatus !== "none").length;
              const isCollapsed = collapsed.has("ch:" + name);
              // 频道内排序：信号在前、无信号次之、已处理垫底
              const rank = (m) => (m.reviewStatus !== "pending" ? 2 : m.aiStatus === "none" ? 1 : 0);
              const ordered = list.slice().sort((a, b) => rank(a) - rank(b));
              return `<div class="list-group ${isCollapsed ? "collapsed" : ""}">
                <div class="lg-head" data-toggle="ch:${name}">
                  <span class="lg-caret">${isCollapsed ? "▸" : "▾"}</span>📡 ${name}
                  <span class="lg-count ${p ? "hot" : ""}">${p} 待处理</span>
                  <span class="lg-state">${list.length} 条</span>
                </div>
                <div class="lg-body">${ordered.map((m) => rowHtml(m, false)).join("")}</div>
              </div>`;
            })
            .join("");
        }
        // 机脊角标只数待办信号（无信号不是「待办建议」）
        document.getElementById("spineCount").textContent = pendingSignal().length;
        // 批量条
        const ids = [...checked].filter((id) => byId(id)?.reviewStatus === "pending");
        document.getElementById("batchCatch").disabled = !ids.length;
        document.getElementById("batchRelease").disabled = !ids.length;
        document.getElementById("batchCatch").textContent = `◎ 批量捕捉${ids.length ? `（${ids.length}）` : ""}`;
        document.getElementById("batchRelease").textContent = `✕ 批量逃走${ids.length ? `（${ids.length}）` : ""}`;
        const allIds = pendingSignal().map((m) => m.id);
        document.getElementById("checkAll").checked = allIds.length > 0 && allIds.every((id) => checked.has(id));
      }

      /* ================= 右栏渲染 ================= */
      function renderDetail() {
        const el = document.getElementById("detail");
        const m = byId(selectedId);
        if (!m) {
          el.innerHTML = `<div class="d-empty">← 在左侧选择一条电波<br />用 ↑↓ 移动、C 捕捉、X 逃走</div>`;
          return;
        }
        let suggest = "";
        if (m.followupTaskId) {
          suggest = `<div class="done-banner">✔ AI 已并入待办 No.${m.followupTaskId} 的跟进记录</div>`;
        } else if (m.reviewStatus === "accepted") {
          suggest = m.applied
            ? `<div class="done-banner">✔ 已更新待办 No.${m.taskId}「${m.updateTaskTitle || ""}」</div>`
            : `<div class="done-banner">✔ 已捕捉为待办 No.${m.taskId}「${m.suggestedTitle || m.content.slice(0, 12)}」</div>`;
        } else if (m.reviewStatus === "dismissed") {
          const why = ESCAPE_REASONS.find(([c]) => c === m.escapeReason);
          suggest = `<div class="done-banner" style="background:#f1eede">✕ 已逃走${why ? ` · 原因：${why[1]}` : ""}</div>`;
        } else if (m.aiStatus === "todo") {
          suggest = `<div class="d-suggest">
            💡 发现待办信号：<b>${m.suggestedTitle}</b>
            ${m.suggestedDue ? `<span>（期限 ${m.suggestedDue}）</span>` : ""}
            ${m.suggestedPriority ? `<span class="sug-prio ${m.suggestedPriority}">${{ urgent: "紧急", high: "高", normal: "普通", low: "低" }[m.suggestedPriority]}</span>` : ""}
            <span class="sug-conf c-${m.conf}">${confLabel(m.conf)}</span>
            ${(m.suggestedTags || []).map((t) => `<span class="sug-tag"># ${t}</span>`).join("")}
            ${m.reason ? `<span class="sug-reason">💡 ${m.reason}</span>` : ""}
          </div>`;
        } else if (m.aiStatus === "update") {
          suggest = `<div class="d-suggest update">
            🔧 建议更新待办 No.${m.updateTaskId}「${m.updateTaskTitle}」
            ${m.suggestedTitle ? `<span>标题 → ${m.suggestedTitle}</span>` : ""}
            ${m.suggestedPriority ? `<span class="sug-prio ${m.suggestedPriority}">${{ normal: "普通", high: "高", urgent: "紧急", low: "低" }[m.suggestedPriority]}</span>` : ""}
            <span class="sug-conf c-${m.conf}">${confLabel(m.conf)}</span>
            ${m.reason ? `<span class="sug-reason">💡 ${m.reason}</span>` : ""}
          </div>`;
        } else {
          suggest = `<div class="d-suggest none">🔇 AI 判定：不是任务${m.reason ? ` · ${m.reason}` : ""}</div>`;
        }

        // 操作区：已处理只读；待处理按 AI 状态给主按钮
        let actions = "";
        if (m.reviewStatus === "pending" && m.aiStatus === "todo") {
          actions = `<button class="btn" data-act="catch">◎ 捕捉<span class="kbd">C</span></button>
            <button class="btn red" data-act="escape">✕ 逃走<span class="kbd">X</span></button>
            <button class="btn ghost er-toggle" data-act="escapeMenu" title="带原因逃走">▾</button>
            <button class="btn ghost" data-act="force">⚡ 强制捕捉<span class="kbd">F</span></button>`;
        } else if (m.reviewStatus === "pending" && m.aiStatus === "update") {
          actions = `<button class="btn" data-act="applyUpdate">◎ 应用更新<span class="kbd">C</span></button>
            <button class="btn red" data-act="escape">✕ 逃走<span class="kbd">X</span></button>
            <button class="btn ghost er-toggle" data-act="escapeMenu" title="带原因逃走">▾</button>`;
        } else if (m.reviewStatus === "pending") {
          actions = `<button class="btn red" data-act="escape">✕ 逃走<span class="kbd">X</span></button>
            <button class="btn ghost er-toggle" data-act="escapeMenu" title="带原因逃走">▾</button>
            <button class="btn ghost" data-act="force">⚡ 强制捕捉<span class="kbd">F</span></button>`;
        } else {
          actions = `<button class="btn ghost" data-act="force">⚡ 强制捕捉<span class="kbd">F</span></button>`;
        }

        el.innerHTML = `<div class="d-body">
          <div class="d-meta">
            <span class="type-badge">${typeLabel(m.chatType)}</span>
            <span>${m.chatName} · ${m.sender}</span>
            <span>${m.time}</span>
            <span class="ai-status">${statusLabel(m.aiStatus)}</span>
          </div>
          <div class="lcd d-content">${m.content}</div>
          ${suggest}
          <div class="d-actions">${actions}</div>
        </div>`;
      }

      /* ================= 动作 ================= */
      function snapshot() {
        undoSnapshot = JSON.stringify(messages);
      }
      function showToast(text) {
        document.querySelector(".toast")?.remove();
        const t = document.createElement("div");
        t.className = "toast";
        t.innerHTML = `<span>${text}</span><button id="undoBtn">↩ 撤销</button>`;
        document.body.appendChild(t);
        t.querySelector("#undoBtn").onclick = undo;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.remove(), 5000);
      }
      function undo() {
        if (!undoSnapshot) return;
        messages = JSON.parse(undoSnapshot);
        undoSnapshot = null;
        document.querySelector(".toast")?.remove();
        renderAll();
      }

      /** 处理完当前条后：选中下一条（信号优先，其次无信号） */
      function advanceFrom(id) {
        const p = [...pendingSignal(), ...pendingNoise()];
        if (!p.length) {
          selectedId = null;
          return;
        }
        const idx = p.findIndex((m) => m.id === id);
        selectedId = (p[idx + 1] || p[Math.max(0, idx - 1)] || p[0]).id;
      }

      function actCatch(m) {
        snapshot();
        m.reviewStatus = "accepted";
        checked.delete(m.id);
        if (m.aiStatus === "update" && m.updateTaskId) {
          m.applied = true;
          m.taskId = m.updateTaskId;
          showToast(`✔ 已更新待办 No.${m.updateTaskId}「${m.updateTaskTitle || ""}」`);
        } else {
          m.taskId = nextTaskNo++;
          showToast(`✔ 已捕捉为待办 No.${m.taskId}「${(m.suggestedTitle || m.content).slice(0, 14)}」`);
        }
        advanceFrom(m.id);
        renderAll();
      }
      function actEscape(m, reason) {
        snapshot();
        m.reviewStatus = "dismissed";
        m.escapeReason = reason;
        checked.delete(m.id);
        showToast(`✕ 已逃走${reason ? "（" + (ESCAPE_REASONS.find(([c]) => c === reason)?.[1] || reason) + "）" : ""}`);
        advanceFrom(m.id);
        renderAll();
      }
      function actForce(m) {
        snapshot();
        const btns = document.querySelectorAll(".d-actions .btn");
        btns.forEach((b) => (b.disabled = true));
        const forceBtn = [...btns].find((b) => b.dataset.act === "force");
        if (forceBtn) forceBtn.textContent = "AI 判重中…";
        setTimeout(() => {
          m.reviewStatus = "accepted";
          m.taskId = nextTaskNo++;
          checked.delete(m.id);
          showToast(`⚡ 已强制创建待办 No.${m.taskId}`);
          advanceFrom(m.id);
          renderAll();
        }, 900);
      }

      function openEscapeMenu(anchorBtn) {
        document.querySelector(".escape-pop")?.remove();
        const pop = document.createElement("div");
        pop.className = "escape-pop";
        pop.innerHTML = `<div class="er-label">为什么逃走？（帮 AI 越判越准）</div>` +
          ESCAPE_REASONS.map(([c, label]) => `<button data-reason="${c}">${label}</button>`).join("") +
          `<button class="just" data-reason="">直接逃走</button>`;
        document.body.appendChild(pop);
        const r = anchorBtn.getBoundingClientRect();
        pop.style.left = Math.min(r.left, window.innerWidth - 210) + "px";
        pop.style.top = Math.min(r.bottom + 6, window.innerHeight - 260) + "px";
        pop.addEventListener("click", (e) => {
          const b = e.target.closest("button[data-reason]");
          if (!b) return;
          pop.remove();
          actEscape(byId(selectedId), b.dataset.reason || undefined);
        });
        setTimeout(() => document.addEventListener("click", function h(e) {
          if (!pop.contains(e.target)) {
            pop.remove();
            document.removeEventListener("click", h);
          }
        }), 0);
      }

      /** 一键清空无信号：噪音不需要逐条审，整组逃走（可撤销） */
      function clearNoise() {
        const targets = pendingNoise();
        if (!targets.length) return;
        snapshot();
        targets.forEach((m) => {
          m.reviewStatus = "dismissed";
          m.escapeReason = "noise";
          checked.delete(m.id);
        });
        showToast(`🔇 已清空 ${targets.length} 条无信号`);
        if (targets.some((m) => m.id === selectedId)) advanceFrom(selectedId);
        renderAll();
      }

      /* ================= 事件 ================= */
      document.getElementById("list").addEventListener("click", (e) => {
        const chk = e.target.closest("input[data-check]");
        if (chk) {
          e.stopPropagation();
          const id = +chk.dataset.check;
          checked.has(id) ? checked.delete(id) : checked.add(id);
          renderList();
          return;
        }
        const clearBtn = e.target.closest("[data-clear-noise]");
        if (clearBtn) {
          e.stopPropagation();
          clearNoise();
          return;
        }
        const head = e.target.closest(".lg-head");
        if (head) {
          const key = head.dataset.toggle;
          collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key);
          renderList();
          return;
        }
        const row = e.target.closest(".rrow");
        if (row) {
          selectedId = +row.dataset.id;
          renderList();
          renderDetail();
        }
      });

      document.getElementById("detail").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const m = byId(selectedId);
        if (!m) return;
        const act = btn.dataset.act;
        if (act === "catch") actCatch(m);
        else if (act === "applyUpdate") actCatch(m);
        else if (act === "escape") actEscape(m);
        else if (act === "force") actForce(m);
        else if (act === "escapeMenu") openEscapeMenu(btn);
      });

      document.getElementById("searchInput").addEventListener("input", renderList);

      document.getElementById("modeTime").onclick = () => setMode("time");
      document.getElementById("modeChannel").onclick = () => setMode("channel");
      function setMode(next) {
        mode = next;
        document.getElementById("modeTime").classList.toggle("on", mode === "time");
        document.getElementById("modeChannel").classList.toggle("on", mode === "channel");
        renderList();
      }

      document.getElementById("checkAll").onchange = (e) => {
        const ids = pending().map((m) => m.id);
        if (e.target.checked) ids.forEach((id) => checked.add(id));
        else ids.forEach((id) => checked.delete(id));
        renderList();
      };
      document.getElementById("hiConfBtn").onclick = () => {
        checked.clear();
        pendingSignal().filter((m) => m.conf === "high").forEach((m) => checked.add(m.id));
        renderList();
      };
      document.getElementById("batchCatch").onclick = () => {
        snapshot();
        const n = [...checked].size;
        [...checked].forEach((id) => {
          const m = byId(id);
          if (m?.reviewStatus === "pending") {
            m.reviewStatus = "accepted";
            m.taskId = nextTaskNo++;
          }
        });
        checked.clear();
        showToast(`✔ 批量捕捉 ${n} 条`);
        renderAll();
      };
      document.getElementById("batchRelease").onclick = () => {
        snapshot();
        const n = [...checked].size;
        [...checked].forEach((id) => {
          const m = byId(id);
          if (m?.reviewStatus === "pending") m.reviewStatus = "dismissed";
        });
        checked.clear();
        showToast(`✕ 批量逃走 ${n} 条`);
        renderAll();
      };

      /* 键盘流：↑↓/J/K 换条 · C 捕捉 · X 逃走 · F 强制 · ? 帮助 */
      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea, select")) return;
        const key = e.key.toLowerCase();
        if (key === "?" || (e.shiftKey && key === "/")) {
          toggleHelp();
          return;
        }
        if (document.querySelector(".help-mask") && (key === "escape" || key === "enter")) {
          toggleHelp();
          return;
        }
        const list = [...pendingSignal(), ...pendingNoise()];
        if (["arrowdown", "j", "arrowup", "k"].includes(key)) {
          e.preventDefault();
          const pool = list.length ? list : messages;
          let i = pool.findIndex((m) => m.id === selectedId);
          i = key === "arrowdown" || key === "j" ? Math.min(pool.length - 1, i + 1) : Math.max(0, i - 1);
          if (i < 0) i = 0;
          selectedId = pool[i].id;
          renderList();
          renderDetail();
          document.querySelector(".rrow.sel")?.scrollIntoView({ block: "nearest" });
        } else if (key === "c" || key === "x" || key === "f") {
          const m = byId(selectedId);
          if (!m || m.reviewStatus !== "pending") return;
          e.preventDefault();
          if (key === "c") {
            // C 只对信号生效；无信号没有「捕捉」可言，避免误建待办
            if (m.aiStatus === "todo" || m.aiStatus === "update") actCatch(m);
          } else if (key === "x") actEscape(m);
          else actForce(m);
        }
      });

      /* 帮助弹层 */
      const HELP_HTML = `<div class="help-mask" id="helpMask">
        <div class="help-card">
          <h2>⌨ 键盘流 — 收音机分诊</h2>
          <div class="help-row"><span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">J</span><span class="kbd">K</span><span class="desc">上/下一条电波</span></div>
          <div class="help-row"><span class="kbd">C</span><span class="desc">捕捉（更新类为「应用更新」）</span></div>
          <div class="help-row"><span class="kbd">X</span><span class="desc">逃走</span></div>
          <div class="help-row"><span class="kbd">F</span><span class="desc">强制捕捉（让 AI 判重后建待办）</span></div>
          <div class="help-row"><span class="kbd">?</span><span class="desc">本帮助</span></div>
          <div class="help-row" style="margin-top:10px"><span class="desc" style="font-size:12px;color:#7b7460">处理完自动跳到下一条；所有动作 5 秒内可撤销。</span></div>
        </div>
      </div>`;
      function toggleHelp() {
        const mask = document.getElementById("helpMask");
        if (mask) mask.remove();
        else document.body.insertAdjacentHTML("beforeend", HELP_HTML);
      }
      document.getElementById("helpMask")?.remove();
      document.getElementById("helpBtn").onclick = toggleHelp;
      document.addEventListener("click", (e) => {
        if (e.target.id === "helpMask") toggleHelp();
      });

      function renderAll() {
        renderList();
        renderDetail();
      }
      renderAll();
    </script>
  </body>
</html>
