<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠</title>
    <style>
      html,
      body,
      /* 页面根与挂载容器一律不接鼠标：桌宠空白区的点击穿透按「实体子元素」
         命中检测（usePetClickThrough），容器自身必须让开 */
      #app {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pet-main.ts"></script>
  </body>
</html>
