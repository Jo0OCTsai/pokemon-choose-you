# lefthook：单工具覆盖 TS+Rust 混仓的 pre-commit 与 commit-msg
# 首次克隆后由 pnpm 的 prepare 脚本自动 install

pre-commit:
  parallel: true
  jobs:
    - name: lint-gate 质量门禁（scaffold 注入；按 .devcontainer/stack.json 路由全量检查）
      run: CLAUDE_PROJECT_DIR="$(git rev-parse --show-toplevel)" bash .claude/hooks/lint-gate.sh
    - name: gitleaks 秘密扫描（暂存内容；豁免 = .gitleaks.toml；本机未装时跳过，CI 兜底）
      run: command -v gitleaks >/dev/null && gitleaks protect --staged --redact || echo "gitleaks 未安装，跳过（CI 供应链 job 兜底）"
    - name: frontend lint + format
      glob: "*.{ts,vue,json,css,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files} && pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    - name: rust format
      glob: "*.rs"
      run: cd src-tauri && cargo fmt
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
